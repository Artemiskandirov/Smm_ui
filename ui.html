<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>AdFlow AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12px; color: #e5e7ed; background: #0e0f14;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed; inset: -50%;
    background:
      radial-gradient(600px circle at 20% 10%, rgba(139, 92, 246, 0.18), transparent 50%),
      radial-gradient(500px circle at 90% 90%, rgba(59, 130, 246, 0.14), transparent 50%),
      radial-gradient(400px circle at 50% 50%, rgba(236, 72, 153, 0.08), transparent 50%);
    z-index: 0; animation: drift 22s ease-in-out infinite alternate; pointer-events: none;
  }
  @keyframes drift { 0%{transform:translate(0,0) rotate(0)} 100%{transform:translate(40px,-30px) rotate(8deg)} }
  #app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  header {
    padding: 14px 18px 12px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05); flex-shrink: 0;
  }
  .logo {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 50%, #ec4899 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(139, 92, 246, 0.35);
    position: relative; overflow: hidden;
  }
  .logo::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.25) 50%, transparent 70%);
    animation: shine 3.5s ease-in-out infinite;
  }
  @keyframes shine { 0%,100%{transform:translateX(-100%)} 50%{transform:translateX(100%)} }
  .logo svg { width: 16px; height: 16px; color: white; position: relative; z-index: 1; }
  .brand h1 { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; color: #f3f4f8; }
  .brand small { font-size: 10px; color: #6b7280; letter-spacing: 0.04em; text-transform: uppercase; }

  .steps {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    background: rgba(0,0,0,0.15); flex-shrink: 0;
  }
  .step {
    flex: 1; display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 8px;
    font-size: 10px; color: #6b7280; letter-spacing: 0.04em;
    transition: all 0.3s;
  }
  .step.active { background: rgba(139,92,246,0.12); color: #c4b5fd; }
  .step.done { color: #34d399; }
  .step-num {
    width: 16px; height: 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.06); font-weight: 600; font-size: 10px;
  }
  .step.active .step-num { background: #8b5cf6; color: white; }
  .step.done .step-num { background: #10b981; color: white; }

  main {
    flex: 1; overflow-y: auto; padding: 16px 18px;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;
  }
  main::-webkit-scrollbar { width: 6px; }
  main::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

  /* Selection card */
  .selection-card {
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px; padding: 12px; margin-bottom: 12px;
    transition: all 0.3s ease;
  }
  .selection-card.active {
    border-color: rgba(139, 92, 246, 0.35);
    background: rgba(139, 92, 246, 0.05);
    box-shadow: 0 0 0 1px rgba(139, 92, 246, 0.15), 0 8px 24px -8px rgba(139, 92, 246, 0.2);
  }
  .sel-row { display: flex; align-items: center; gap: 10px; }
  .sel-icon {
    width: 30px; height: 30px; border-radius: 8px;
    background: rgba(255,255,255,0.04);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .selection-card.active .sel-icon {
    background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(59,130,246,0.2));
  }
  .sel-icon svg { width: 14px; height: 14px; color: #8b5cf6; }
  .sel-info { flex: 1; min-width: 0; }
  .sel-title { font-size: 12px; font-weight: 500; color: #f3f4f8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sel-meta { font-size: 11px; color: #6b7280; margin-top: 2px; }

  /* Primary button */
  .btn-primary {
    width: 100%; padding: 13px 18px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
    color: white; font-size: 13px; font-weight: 600; font-family: inherit;
    cursor: pointer; position: relative; overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.3s ease;
    box-shadow: 0 4px 14px -2px rgba(139, 92, 246, 0.4), 0 0 0 1px rgba(255,255,255,0.05) inset;
    margin-bottom: 16px;
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 24px -4px rgba(139, 92, 246, 0.6); }
  .btn-primary:active:not(:disabled) { transform: translateY(0); }
  .btn-primary:disabled { background: rgba(255,255,255,0.06); color: #4b5563; cursor: not-allowed; box-shadow: none; }
  .btn-primary::before {
    content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
    transition: left 0.6s;
  }
  .btn-primary:hover:not(:disabled)::before { left: 100%; }
  .btn-primary .btn-content { display: flex; align-items: center; justify-content: center; gap: 8px; position: relative; z-index: 1; }

  .btn-generate {
    background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 50%, #3b82f6 100%);
    background-size: 200% 200%;
    animation: gradient-shift 3s ease infinite;
    padding: 15px 20px; font-size: 13px;
    box-shadow: 0 6px 20px -4px rgba(236, 72, 153, 0.45), 0 0 0 1px rgba(255,255,255,0.05) inset;
  }
  @keyframes gradient-shift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

  .progress-card {
    background: rgba(255,255,255,0.025); border: 1px solid rgba(139, 92, 246, 0.2);
    border-radius: 12px; padding: 20px; text-align: center;
    animation: fadeIn 0.4s ease;
  }
  .progress-spinner {
    width: 40px; height: 40px; margin: 0 auto 14px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent, #8b5cf6, #3b82f6, #ec4899, transparent);
    animation: spin 1.2s linear infinite; position: relative;
  }
  .progress-spinner::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: #0e0f14; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress-text { font-size: 12px; color: #d1d5db; margin-bottom: 4px; font-weight: 500; }
  .progress-sub { font-size: 10px; color: #6b7280; letter-spacing: 0.04em; }

  .summary-card {
    background: linear-gradient(135deg, rgba(139,92,246,0.08), rgba(59,130,246,0.05));
    border: 1px solid rgba(139, 92, 246, 0.18);
    border-radius: 12px; padding: 12px; margin-bottom: 14px;
    animation: fadeIn 0.5s ease;
  }
  .summary-label {
    font-size: 10px; color: #8b5cf6;
    text-transform: uppercase; letter-spacing: 0.08em;
    font-weight: 600; margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .summary-label::before {
    content: ''; width: 4px; height: 4px; border-radius: 50%;
    background: #8b5cf6; box-shadow: 0 0 8px #8b5cf6;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .summary-text { font-size: 12px; line-height: 1.5; color: #e5e7ed; }

  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px; margin-top: 16px;
  }
  .section-head:first-child { margin-top: 0; }
  .section-title {
    font-size: 11px; font-weight: 600; color: #9ca3af;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .section-count {
    font-size: 10px; color: #6b7280;
    background: rgba(255,255,255,0.05); padding: 2px 8px; border-radius: 10px;
  }

  .layer-list { display: flex; flex-direction: column; gap: 5px; }
  .layer {
    background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.04);
    border-radius: 10px; padding: 8px 10px;
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; position: relative; overflow: hidden;
    transition: all 0.2s ease;
    animation: slideUp 0.35s ease backwards;
  }
  .layer:hover { border-color: rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); transform: translateX(2px); }
  .layer::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--role-color, #6b7280); box-shadow: 0 0 12px var(--role-color, transparent);
  }
  .layer-name {
    flex: 1; min-width: 0;
    font-size: 11px; font-weight: 500; color: #e5e7ed;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .role-badge {
    font-size: 9px; font-weight: 600; padding: 2px 6px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 0.04em;
    background: var(--role-bg, rgba(107,114,128,0.15));
    color: var(--role-color, #9ca3af);
  }
  .confidence-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .confidence-dot.high { background: #10b981; box-shadow: 0 0 6px rgba(16,185,129,0.5); }
  .confidence-dot.mid  { background: #f59e0b; box-shadow: 0 0 6px rgba(245,158,11,0.5); }
  .confidence-dot.low  { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,0.5); }

  /* Mode toggle */
  .mode-toggle {
    display: flex; background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 3px;
    margin-bottom: 12px;
  }
  .mode-option {
    flex: 1; padding: 8px 10px; text-align: center;
    font-size: 11px; font-weight: 500; color: #9ca3af;
    border-radius: 7px; cursor: pointer; transition: all 0.25s;
    user-select: none;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .mode-option svg { width: 13px; height: 13px; }
  .mode-option.active {
    background: linear-gradient(135deg, rgba(139,92,246,0.25), rgba(59,130,246,0.18));
    color: #f3f4f8;
    box-shadow: 0 2px 8px -2px rgba(139,92,246,0.4);
  }
  .mode-desc {
    font-size: 10px; color: #6b7280; padding: 0 4px 12px;
    line-height: 1.5;
  }

  /* Group header */
  .group-head {
    font-size: 10px; font-weight: 600; color: #6b7280;
    text-transform: uppercase; letter-spacing: 0.06em;
    margin: 12px 0 6px; padding-left: 2px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .group-head:first-child { margin-top: 4px; }
  .group-actions { display: flex; gap: 4px; }

  /* Ratio chip — compact */
  .ratio-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  }
  .ratio-chip {
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 9px; padding: 9px 10px; cursor: pointer;
    transition: all 0.2s; position: relative;
    user-select: none;
    display: flex; align-items: center; gap: 8px;
  }
  .ratio-chip:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.12); }
  .ratio-chip.selected {
    border-color: rgba(139, 92, 246, 0.5);
    background: rgba(139, 92, 246, 0.08);
    box-shadow: 0 0 0 1px rgba(139, 92, 246, 0.3);
  }
  .ratio-preview {
    background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(59,130,246,0.1));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 3px; flex-shrink: 0;
    transition: all 0.2s;
  }
  .ratio-chip.selected .ratio-preview {
    background: linear-gradient(135deg, rgba(139,92,246,0.4), rgba(59,130,246,0.25));
    border-color: rgba(139,92,246,0.6);
  }
  .ratio-info { flex: 1; min-width: 0; }
  .ratio-name {
    font-size: 11px; font-weight: 600; color: #e5e7ed;
    line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ratio-dim {
    font-size: 9px; color: #6b7280;
    font-family: 'SF Mono', Menlo, monospace;
    margin-top: 1px;
  }
  .ratio-delete {
    width: 18px; height: 18px; border-radius: 4px;
    background: rgba(239,68,68,0.1); border: none;
    color: #ef4444; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.2s;
    flex-shrink: 0;
  }
  .ratio-chip:hover .ratio-delete { opacity: 1; }
  .ratio-delete:hover { background: rgba(239,68,68,0.2); }
  .ratio-delete svg { width: 10px; height: 10px; }

  /* Add custom button */
  .add-custom-btn {
    background: rgba(255,255,255,0.02);
    border: 1px dashed rgba(255,255,255,0.12);
    border-radius: 9px; padding: 9px 10px;
    color: #9ca3af; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: all 0.2s;
    font-size: 11px; font-weight: 500;
    font-family: inherit;
  }
  .add-custom-btn:hover {
    background: rgba(139,92,246,0.05);
    border-color: rgba(139,92,246,0.35);
    color: #c4b5fd;
  }
  .add-custom-btn svg { width: 12px; height: 12px; }

  /* Add custom form */
  .add-form {
    background: rgba(139, 92, 246, 0.04);
    border: 1px solid rgba(139, 92, 246, 0.25);
    border-radius: 10px; padding: 12px;
    margin-top: 8px;
    animation: fadeIn 0.25s ease;
  }
  .form-row { display: flex; gap: 6px; margin-bottom: 8px; }
  .form-row:last-of-type { margin-bottom: 10px; }
  .form-input {
    flex: 1; min-width: 0;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 7px; padding: 8px 10px;
    color: #e5e7ed; font-size: 11px;
    font-family: inherit;
    transition: border-color 0.2s;
  }
  .form-input:focus {
    outline: none;
    border-color: rgba(139,92,246,0.6);
    background: rgba(0,0,0,0.35);
  }
  .form-input::placeholder { color: #4b5563; }
  .form-buttons { display: flex; gap: 6px; }
  .form-btn {
    flex: 1; padding: 7px 12px;
    border-radius: 7px; border: none; cursor: pointer;
    font-size: 11px; font-weight: 500; font-family: inherit;
    transition: all 0.15s;
  }
  .form-btn-cancel {
    background: rgba(255,255,255,0.04);
    color: #9ca3af;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .form-btn-cancel:hover { background: rgba(255,255,255,0.07); }
  .form-btn-save {
    background: linear-gradient(135deg, #8b5cf6, #3b82f6);
    color: white;
    box-shadow: 0 2px 8px -2px rgba(139,92,246,0.5);
  }
  .form-btn-save:hover { transform: translateY(-1px); box-shadow: 0 4px 12px -2px rgba(139,92,246,0.7); }
  .form-btn-save:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  .form-error {
    font-size: 10px; color: #f87171;
    margin-top: 6px; line-height: 1.4;
  }

  /* Selected counter / action bar */
  .selection-bar {
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 8px; padding: 8px 12px;
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 12px; margin-bottom: 8px;
    font-size: 11px;
  }
  .selection-bar-count { color: #d1d5db; font-weight: 500; }
  .selection-bar-clear {
    background: none; border: none; color: #6b7280;
    font-size: 10px; cursor: pointer; padding: 0;
    font-family: inherit;
    text-decoration: underline;
    text-decoration-color: transparent;
    transition: text-decoration-color 0.2s;
  }
  .selection-bar-clear:hover { text-decoration-color: #6b7280; }

  /* Issues */
  .issue {
    background: rgba(245, 158, 11, 0.06); border: 1px solid rgba(245, 158, 11, 0.18);
    border-radius: 10px; padding: 9px 11px; margin-bottom: 5px;
    animation: slideUp 0.35s ease backwards;
  }
  .issue.critical { background: rgba(239, 68, 68, 0.07); border-color: rgba(239, 68, 68, 0.2); }
  .issue.suggestion { background: rgba(59, 130, 246, 0.06); border-color: rgba(59, 130, 246, 0.18); }
  .issue-head { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .issue-severity { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 6px; border-radius: 4px; }
  .issue.warning .issue-severity { background: rgba(245,158,11,0.2); color: #fbbf24; }
  .issue.critical .issue-severity { background: rgba(239,68,68,0.2); color: #f87171; }
  .issue.suggestion .issue-severity { background: rgba(59,130,246,0.2); color: #60a5fa; }
  .issue-type { font-size: 11px; font-weight: 500; color: #e5e7ed; }
  .issue-fix { font-size: 11px; line-height: 1.5; color: #9ca3af; }

  /* Apply names link */
  .apply-link {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 9px; border-radius: 6px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: #d1d5db; font-size: 10px; cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .apply-link:hover { background: rgba(255,255,255,0.07); }
  .apply-link svg { width: 11px; height: 11px; }

  /* Success */
  .success {
    background: linear-gradient(135deg, rgba(16,185,129,0.1), rgba(16,185,129,0.05));
    border: 1px solid rgba(16,185,129,0.3);
    border-radius: 12px; padding: 12px;
    display: flex; align-items: center; gap: 12px;
    animation: fadeIn 0.5s ease;
    margin-bottom: 14px;
  }
  .success-icon {
    width: 30px; height: 30px; border-radius: 50%;
    background: #10b981; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 16px rgba(16,185,129,0.5);
  }
  .success-icon svg { width: 15px; height: 15px; color: white; }
  .success-text { font-size: 12px; color: #d1fae5; font-weight: 500; }
  .success-sub { font-size: 11px; color: #6ee7b7; margin-top: 2px; }

  .error-card {
    background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.25);
    border-radius: 10px; padding: 11px; color: #fca5a5; font-size: 12px;
    margin-bottom: 12px; animation: shake 0.4s ease;
  }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

  .empty-state { text-align: center; padding: 28px 16px; color: #6b7280; }
  .empty-icon {
    width: 44px; height: 44px; margin: 0 auto 10px; border-radius: 12px;
    background: rgba(255,255,255,0.03);
    display: flex; align-items: center; justify-content: center;
  }
  .empty-icon svg { width: 22px; height: 22px; color: #4b5563; }
  .empty-title { font-size: 12px; color: #9ca3af; margin-bottom: 4px; font-weight: 500; }
  .empty-sub { font-size: 11px; color: #6b7280; line-height: 1.5; }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    margin: 16px 0;
  }

  @keyframes fadeIn { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)} }
  @keyframes slideUp { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
    </div>
    <div class="brand">
      <h1>AdFlow AI</h1>
      <small>Семантика + генерация креативов</small>
    </div>
  </header>

  <div class="steps">
    <div class="step active" id="step-1">
      <div class="step-num">1</div>
      <span>Analyze</span>
    </div>
    <div class="step" id="step-2">
      <div class="step-num">2</div>
      <span>Generate</span>
    </div>
  </div>

  <main>
    <div id="selection" class="selection-card">
      <div class="sel-row">
        <div class="sel-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
          </svg>
        </div>
        <div class="sel-info">
          <div class="sel-title" id="sel-title">Ничего не выделено</div>
          <div class="sel-meta" id="sel-meta">Выделите Frame в Figma, чтобы начать</div>
        </div>
      </div>
    </div>

    <button id="analyze" class="btn-primary" disabled>
      <span class="btn-content">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
        <span>Анализировать через GPT-5.5</span>
      </span>
    </button>

    <div id="content">
      <div class="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </div>
        <div class="empty-title">Готов к работе</div>
        <div class="empty-sub">
          Шаг 1: AI определит роли слоёв<br/>
          Шаг 2: создам адаптации в нужных форматах
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const BACKEND_URL = 'https://smm-ui-navy.vercel.app';

const ROLE_COLORS = {
  headline:   { color: '#a78bfa', bg: 'rgba(167,139,250,0.15)' },
  subtitle:   { color: '#8b5cf6', bg: 'rgba(139,92,246,0.12)' },
  body:       { color: '#9ca3af', bg: 'rgba(156,163,175,0.12)' },
  cta:        { color: '#10b981', bg: 'rgba(16,185,129,0.15)' },
  logo:       { color: '#3b82f6', bg: 'rgba(59,130,246,0.15)' },
  hero_image: { color: '#ec4899', bg: 'rgba(236,72,153,0.15)' },
  product:    { color: '#f472b6', bg: 'rgba(244,114,182,0.15)' },
  decorative: { color: '#6b7280', bg: 'rgba(107,114,128,0.12)' },
  background: { color: '#4b5563', bg: 'rgba(75,85,99,0.12)' },
  icon:       { color: '#60a5fa', bg: 'rgba(96,165,250,0.12)' },
  unknown:    { color: '#9ca3af', bg: 'rgba(156,163,175,0.1)' },
};
const ROLE_LABEL = {
  headline: 'Заголовок', subtitle: 'Подзаголовок', body: 'Текст',
  cta: 'CTA', logo: 'Лого', hero_image: 'Hero', product: 'Продукт',
  decorative: 'Декор', background: 'Фон', icon: 'Иконка', unknown: '?',
};

// ---------- State ----------
let lastResult = null;
let lastLayoutIndex = null;
let lastMasterFrameId = null;
let builtinRatios = [];
let customRatios = [];
let selectedRatioIds = new Set();
let generateMode = 'smart';
let showAddForm = false;
let isAnalyzing = false;
let isGenerating = false;

const $selection = document.getElementById('selection');
const $selTitle  = document.getElementById('sel-title');
const $selMeta   = document.getElementById('sel-meta');
const $analyze   = document.getElementById('analyze');
const $content   = document.getElementById('content');
const $step1     = document.getElementById('step-1');
const $step2     = document.getElementById('step-2');

// ---------- Plugin message router ----------
window.onmessage = async (e) => {
  const msg = e.data.pluginMessage;
  if (!msg) return;
  switch (msg.type) {
    case 'selection': handleSelection(msg); break;
    case 'builtin-ratios': builtinRatios = msg.presets || []; rerenderRatiosIfShown(); break;
    case 'custom-ratios': customRatios = msg.presets || []; rerenderRatiosIfShown(); break;
    case 'progress': showProgress(msg.message); break;
    case 'analyze-payload': await callBackend(msg); break;
    case 'error':
      showError(msg.message);
      isAnalyzing = false; isGenerating = false;
      setAnalyzeEnabled(true);
      break;
    case 'generate-done':
      isGenerating = false;
      showGenerateSuccess(msg.count);
      break;
  }
};

function postToPlugin(msg) { parent.postMessage({ pluginMessage: msg }, '*'); }

// ---------- Selection ----------
function handleSelection(msg) {
  if (msg.hasFrame) {
    $selection.classList.add('active');
    $selTitle.textContent = msg.frameName;
    $selMeta.textContent = `${msg.frameWidth} × ${msg.frameHeight} px`;
    setAnalyzeEnabled(!isAnalyzing);
  } else {
    $selection.classList.remove('active');
    $selTitle.textContent = 'Ничего не выделено';
    $selMeta.textContent = 'Выделите Frame в Figma, чтобы начать';
    setAnalyzeEnabled(false);
  }
}
function setAnalyzeEnabled(on) { $analyze.disabled = !on; }

// ---------- Analyze ----------
$analyze.addEventListener('click', () => {
  if (isAnalyzing) return;
  isAnalyzing = true;
  setAnalyzeEnabled(false);
  lastResult = null;
  postToPlugin({ type: 'analyze' });
});

function showProgress(text) {
  $content.innerHTML = `
    <div class="progress-card">
      <div class="progress-spinner"></div>
      <div class="progress-text">${escapeHtml(text)}</div>
      <div class="progress-sub">подожди…</div>
    </div>`;
}
function showError(text) {
  $content.innerHTML = `<div class="error-card">⚠️ ${escapeHtml(text)}</div>` + (lastResult ? renderResult(lastResult, true) : '');
  bindAll();
}

function indexNodes(node, map) {
  map = map || new Map();
  map.set(node.id, node);
  for (const c of (node.children || [])) indexNodes(c, map);
  return map;
}

async function callBackend(payload) {
  showProgress('GPT-5.5 анализирует композицию…');
  try {
    const res = await fetch(BACKEND_URL + '/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        layoutJson: payload.layoutJson,
        screenshotBase64: payload.screenshotBase64,
        frameWidth: payload.frameWidth,
        frameHeight: payload.frameHeight,
      }),
    });
    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`Backend ${res.status}: ${errText.slice(0, 200)}`);
    }
    const data = await res.json();
    lastResult = data;
    lastLayoutIndex = indexNodes(payload.layoutJson);
    lastMasterFrameId = payload.masterFrameId;

    postToPlugin({
      type: 'cache-semantic',
      masterFrameId: payload.masterFrameId,
      layers: data.layers.map(l => ({
        node_id: l.node_id, role: l.semantic_role, importance: l.importance,
      })),
    });

    $step1.classList.remove('active');
    $step1.classList.add('done');
    $step2.classList.add('active');

    $content.innerHTML = renderResult(data, true);
    bindAll();
  } catch (err) {
    showError(err.message || String(err));
  } finally {
    isAnalyzing = false;
    setAnalyzeEnabled(true);
  }
}

// ---------- Render result ----------
function renderResult(data, includeGenerate) {
  const layers = data.layers || [];
  const issues = data.structural_issues || [];
  const assess = data.overall_assessment || {};
  const sortedLayers = [...layers].sort((a, b) => (b.importance || 0) - (a.importance || 0));
  const topLayers = sortedLayers.slice(0, 5);

  let html = '';
  if (assess.summary) {
    html += `
      <div class="summary-card">
        <div class="summary-label">AI оценка макета</div>
        <div class="summary-text">${escapeHtml(assess.summary)}</div>
      </div>`;
  }
  if (topLayers.length) {
    const renames = collectRenames();
    html += `
      <div class="section-head">
        <div class="section-title">Главные элементы</div>
        ${renames.length ? `<button class="apply-link" id="apply-all">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
          переименовать ${renames.length}
        </button>` : `<div class="section-count">${topLayers.length}</div>`}
      </div>
      <div class="layer-list">${topLayers.map((l, i) => renderLayer(l, i)).join('')}</div>`;
  }
  if (issues.length) {
    html += `
      <div class="section-head">
        <div class="section-title">Замечания</div>
        <div class="section-count">${issues.length}</div>
      </div>
      <div>${issues.slice(0,3).map((it, i) => renderIssue(it, i)).join('')}</div>`;
  }
  if (includeGenerate) {
    html += `<div class="divider"></div>` + renderGenerateSection();
  }
  return html;
}

function renderLayer(layer, idx) {
  const role = layer.semantic_role || 'unknown';
  const palette = ROLE_COLORS[role] || ROLE_COLORS.unknown;
  const conf = layer.confidence || 0;
  const confClass = conf >= 0.8 ? 'high' : conf >= 0.5 ? 'mid' : 'low';
  const origNode = lastLayoutIndex ? lastLayoutIndex.get(layer.node_id) : null;
  const origName = origNode ? origNode.name : '(unknown)';
  return `
    <div class="layer"
         data-node-id="${escapeAttr(layer.node_id)}"
         style="--role-color:${palette.color};--role-bg:${palette.bg};animation-delay:${idx * 25}ms">
      <span class="role-badge">${escapeHtml(ROLE_LABEL[role] || role)}</span>
      <div class="layer-name">${escapeHtml(origName)}</div>
      <span class="confidence-dot ${confClass}" title="${(conf*100).toFixed(0)}%"></span>
    </div>`;
}
function renderIssue(issue, idx) {
  const sev = issue.severity || 'warning';
  const sevLabel = sev === 'critical' ? 'Критично' : sev === 'suggestion' ? 'Совет' : 'Внимание';
  return `
    <div class="issue ${sev}" style="animation-delay:${idx * 40}ms">
      <div class="issue-head">
        <span class="issue-severity">${sevLabel}</span>
        <span class="issue-type">${escapeHtml(issue.type)}</span>
      </div>
      <div class="issue-fix">${escapeHtml(issue.fix_suggestion || '')}</div>
    </div>`;
}

// ---------- Generate section ----------
function renderGenerateSection() {
  return `
    <div class="section-head">
      <div class="section-title">Генерация креативов</div>
    </div>

    <div class="mode-toggle">
      <div class="mode-option ${generateMode === 'smart' ? 'active' : ''}" data-mode="smart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.7.7 1 1.5 1 2.3v1h6v-1c0-.8.3-1.6 1-2.3A7 7 0 0 0 12 2z"/>
        </svg>
        Smart Layout
      </div>
      <div class="mode-option ${generateMode === 'simple' ? 'active' : ''}" data-mode="simple">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
        </svg>
        Simple Resize
      </div>
    </div>
    <div class="mode-desc">
      ${generateMode === 'smart'
        ? 'AI переставит элементы по правилам шаблона. Декор сохранится фоном.'
        : 'Просто масштабирую макет под формат, ничего не двигая.'}
    </div>

    ${renderRatioGroups()}

    ${renderSelectionBar()}

    <button id="generate" class="btn-primary btn-generate" disabled>
      <span class="btn-content">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
        <span id="gen-label">Выбери форматы выше</span>
      </span>
    </button>`;
}

function renderRatioGroups() {
  const all = [...builtinRatios, ...customRatios];
  const groups = {};
  for (const r of all) {
    const g = r.group || 'Other';
    if (!groups[g]) groups[g] = [];
    groups[g].push(r);
  }
  // Stable order
  const orderedGroups = ['Instagram', 'Facebook', 'YouTube', 'TikTok', 'Twitter', 'LinkedIn', 'Pinterest', 'Other', 'Custom'];
  const knownGroups = orderedGroups.filter(g => groups[g]);
  const extraGroups = Object.keys(groups).filter(g => !orderedGroups.includes(g));
  const finalGroups = [...knownGroups, ...extraGroups];

  let html = '';
  for (const g of finalGroups) {
    const items = groups[g];
    const isCustom = g === 'Custom';
    html += `
      <div class="group-head">
        <span>${escapeHtml(g)}</span>
        ${isCustom ? '' : `<span style="color:#4b5563">${items.length}</span>`}
      </div>
      <div class="ratio-grid">
        ${items.map(r => renderRatioChip(r)).join('')}
      </div>`;
  }
  // Add custom row (form or button)
  if (showAddForm) {
    html += renderAddForm();
  } else {
    html += `
      <button class="add-custom-btn" id="show-add-form" style="width:100%; margin-top:10px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Добавить свой формат
      </button>`;
  }
  return html;
}

function renderRatioChip(r) {
  const maxBox = 32;
  const aspect = r.width / r.height;
  let pw, ph;
  if (aspect >= 1) { pw = maxBox; ph = maxBox / aspect; }
  else { ph = maxBox; pw = maxBox * aspect; }
  const isSelected = selectedRatioIds.has(r.id);
  const canDelete = !r.builtin;
  return `
    <div class="ratio-chip ${isSelected ? 'selected' : ''}" data-ratio-id="${escapeAttr(r.id)}">
      <div class="ratio-preview" style="width:${pw}px;height:${ph}px"></div>
      <div class="ratio-info">
        <div class="ratio-name">${escapeHtml(r.name)}</div>
        <div class="ratio-dim">${r.width}×${r.height}</div>
      </div>
      ${canDelete ? `<button class="ratio-delete" data-delete-id="${escapeAttr(r.id)}" title="Удалить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>` : ''}
    </div>`;
}

function renderAddForm() {
  return `
    <div class="add-form" id="add-form">
      <div class="form-row">
        <input type="text" class="form-input" id="form-name" placeholder="Название (например: Telegram Sticker)" maxlength="40" />
      </div>
      <div class="form-row">
        <input type="number" class="form-input" id="form-width" placeholder="Ширина (px)" min="50" max="10000" />
        <input type="number" class="form-input" id="form-height" placeholder="Высота (px)" min="50" max="10000" />
      </div>
      <div class="form-buttons">
        <button class="form-btn form-btn-cancel" id="form-cancel">Отмена</button>
        <button class="form-btn form-btn-save" id="form-save">Добавить</button>
      </div>
      <div class="form-error" id="form-error" style="display:none"></div>
    </div>`;
}

function renderSelectionBar() {
  const n = selectedRatioIds.size;
  if (n === 0) return '';
  return `
    <div class="selection-bar">
      <span class="selection-bar-count">Выбрано: ${n} ${pluralRu(n, ['формат','формата','форматов'])}</span>
      <button class="selection-bar-clear" id="clear-selection">очистить</button>
    </div>`;
}

// ---------- Bindings ----------
function bindAll() {
  bindLayerClicks();
  bindRatioChips();
  bindRatioDeletes();
  bindGenerateButton();
  bindApplyNames();
  bindModeToggle();
  bindAddForm();
  bindClearSelection();
}

function bindLayerClicks() {
  document.querySelectorAll('.layer').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.nodeId;
      if (id) postToPlugin({ type: 'focus-node', nodeId: id });
    });
  });
}

function bindRatioChips() {
  document.querySelectorAll('.ratio-chip').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.ratio-delete')) return; // delete button handled separately
      const id = el.dataset.ratioId;
      if (selectedRatioIds.has(id)) {
        selectedRatioIds.delete(id);
        el.classList.remove('selected');
      } else {
        selectedRatioIds.add(id);
        el.classList.add('selected');
      }
      // Re-render selection bar
      rerenderSelectionBarAndButton();
    });
  });
}

function bindRatioDeletes() {
  document.querySelectorAll('.ratio-delete').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = el.dataset.deleteId;
      if (!id) return;
      selectedRatioIds.delete(id);
      postToPlugin({ type: 'delete-custom-ratio', id });
    });
  });
}

function bindGenerateButton() {
  const btn = document.getElementById('generate');
  if (!btn) return;
  btn.addEventListener('click', () => {
    if (isGenerating || selectedRatioIds.size === 0) return;
    isGenerating = true;
    btn.disabled = true;
    document.getElementById('gen-label').textContent = 'Генерирую…';
    const allRatios = [...builtinRatios, ...customRatios];
    const chosen = allRatios.filter(r => selectedRatioIds.has(r.id));
    postToPlugin({ type: 'generate', ratios: chosen, mode: generateMode });
  });
}

function bindModeToggle() {
  document.querySelectorAll('.mode-option').forEach(el => {
    el.addEventListener('click', () => {
      const mode = el.dataset.mode;
      if (mode === generateMode) return;
      generateMode = mode;
      // Re-render only the generate section: rebuild full content
      $content.innerHTML = renderResult(lastResult, true);
      bindAll();
    });
  });
}

function bindAddForm() {
  const showBtn = document.getElementById('show-add-form');
  if (showBtn) {
    showBtn.addEventListener('click', () => {
      showAddForm = true;
      rerenderRatiosIfShown();
      setTimeout(() => document.getElementById('form-name')?.focus(), 50);
    });
  }
  const cancelBtn = document.getElementById('form-cancel');
  if (cancelBtn) {
    cancelBtn.addEventListener('click', () => {
      showAddForm = false;
      rerenderRatiosIfShown();
    });
  }
  const saveBtn = document.getElementById('form-save');
  if (saveBtn) {
    saveBtn.addEventListener('click', submitAddForm);
  }
  // Enter to submit
  ['form-name', 'form-width', 'form-height'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitAddForm();
      if (e.key === 'Escape') { showAddForm = false; rerenderRatiosIfShown(); }
    });
  });
}

function submitAddForm() {
  const name = (document.getElementById('form-name')?.value || '').trim();
  const w = parseInt(document.getElementById('form-width')?.value || '0', 10);
  const h = parseInt(document.getElementById('form-height')?.value || '0', 10);
  const $err = document.getElementById('form-error');
  function showFormError(msg) {
    if ($err) { $err.textContent = msg; $err.style.display = 'block'; }
  }
  if (!name) return showFormError('Укажи название формата.');
  if (!w || w < 50 || w > 10000) return showFormError('Ширина: число от 50 до 10000.');
  if (!h || h < 50 || h > 10000) return showFormError('Высота: число от 50 до 10000.');
  postToPlugin({ type: 'add-custom-ratio', name, width: w, height: h });
  showAddForm = false;
  // Wait for plugin to send back updated custom list — that triggers re-render
}

function bindApplyNames() {
  const btn = document.getElementById('apply-all');
  if (!btn) return;
  btn.addEventListener('click', () => {
    const renames = collectRenames();
    if (!renames.length) return;
    postToPlugin({ type: 'apply-all-names', renames });
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> готово`;
    btn.disabled = true;
  });
}

function bindClearSelection() {
  const btn = document.getElementById('clear-selection');
  if (!btn) return;
  btn.addEventListener('click', () => {
    selectedRatioIds.clear();
    rerenderRatiosIfShown();
  });
}

function rerenderRatiosIfShown() {
  // Only re-render if we're past Analyze stage (i.e. lastResult exists)
  if (lastResult) {
    $content.innerHTML = renderResult(lastResult, true);
    bindAll();
  }
}

function rerenderSelectionBarAndButton() {
  // Find existing selection bar and replace; also update button label
  const existing = document.querySelector('.selection-bar');
  const newBarHtml = renderSelectionBar();
  if (existing) {
    if (newBarHtml) {
      existing.outerHTML = newBarHtml;
      bindClearSelection();
    } else {
      existing.remove();
    }
  } else if (newBarHtml) {
    const btn = document.getElementById('generate');
    if (btn) {
      btn.insertAdjacentHTML('beforebegin', newBarHtml);
      bindClearSelection();
    }
  }
  updateGenerateButton();
}

function updateGenerateButton() {
  const btn = document.getElementById('generate');
  const label = document.getElementById('gen-label');
  if (!btn || !label) return;
  const n = selectedRatioIds.size;
  if (n === 0) {
    btn.disabled = true;
    label.textContent = 'Выбери форматы выше';
  } else {
    btn.disabled = false;
    label.textContent = `Создать ${n} ${pluralRu(n, ['креатив','креатива','креативов'])}`;
  }
}

function pluralRu(n, forms) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod100 >= 11 && mod100 <= 14) return forms[2];
  if (mod10 === 1) return forms[0];
  if (mod10 >= 2 && mod10 <= 4) return forms[1];
  return forms[2];
}

function collectRenames() {
  if (!lastResult || !lastLayoutIndex) return [];
  const renames = [];
  for (const l of (lastResult.layers || [])) {
    const orig = lastLayoutIndex.get(l.node_id);
    if (!orig) continue;
    if (l.suggested_name && l.suggested_name !== orig.name) {
      renames.push({ nodeId: l.node_id, newName: l.suggested_name });
    }
  }
  return renames;
}

function showGenerateSuccess(count) {
  const success = `
    <div class="success">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div>
        <div class="success-text">Создано ${count} ${pluralRu(count, ['креатив','креатива','креативов'])}</div>
        <div class="success-sub">смотри справа от исходного фрейма</div>
      </div>
    </div>`;
  $step2.classList.remove('active');
  $step2.classList.add('done');
  $content.innerHTML = success + (lastResult ? renderResult(lastResult, true) : '');
  bindAll();
}

// Utils
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeAttr(s) { return escapeHtml(s); }
