<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f5"><meta name="description" content="Процедурная библиотека звуков и Core Haptics-паттернов для детских образовательных интерфейсов"><title>CueLab — звуки и хаптики для Учи.ру</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><style>html,body{height:100%;margin:0;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#111}body{display:grid;place-items:center}.loader{display:grid;gap:14px;justify-items:center;font-size:13px;color:rgba(17,17,17,.56)}.mark{width:42px;height:42px;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:13px;background:#111}.mark i{display:block;width:5px;border-radius:9px;background:white}.mark i:nth-child(1){height:12px;opacity:.7}.mark i:nth-child(2){height:26px;background:#1a94ff}.mark i:nth-child(3){height:17px}</style></head><body><div class="loader"><span class="mark"><i></i><i></i><i></i></span><span>Загружаем CueLab…</span></div><script type="module">try{const n=['cuelab-data-00.txt', 'cuelab-data-01.txt', 'cuelab-data-02.txt', 'cuelab-data-03.txt', 'cuelab-data-04.txt', 'cuelab-data-05.txt', 'cuelab-data-06.txt', 'cuelab-data-07.txt', 'cuelab-data-08.txt', 'cuelab-data-09.txt', 'cuelab-data-10.txt', 'cuelab-data-11.txt', 'cuelab-data-12.txt', 'cuelab-data-13.txt', 'cuelab-data-14.txt', 'cuelab-data-15.txt'];const p=await Promise.all(n.map(async x=>{const r=await fetch(x,{cache:'force-cache'});if(!r.ok)throw new Error(x+': '+r.status);return r.text()}));const b=atob(p.join(''));const u=Uint8Array.from(b,c=>c.charCodeAt(0));if(!('DecompressionStream' in window))throw new Error('DecompressionStream unsupported');const s=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));const h=await new Response(s).text();document.open();document.write(h);document.close()}catch(e){console.error(e);document.body.innerHTML='<main style="max-width:520px;padding:32px"><h1 style="font-size:24px">CueLab не загрузился</h1><p style="line-height:1.5;color:rgba(17,17,17,.64)">Обновите страницу в современном браузере.</p></main>'}</script></body></html>
