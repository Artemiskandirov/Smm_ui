<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <meta name="description" content="CueLab v10 — motion-first библиотека звуков и хаптиков для детских образовательных интерфейсов">
  <title>CueLab v10 — звуки и хаптики для Учи.ру</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#111;background:#f5f5f5}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:24px}
    .loader{display:grid;justify-items:center;gap:14px;color:rgba(17,17,17,.56);font-size:13px;text-align:center}
    .mark{width:42px;height:42px;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:13px;background:#111}
    .mark i{display:block;width:5px;border-radius:999px;background:#fff}.mark i:nth-child(1){height:12px;opacity:.7}.mark i:nth-child(2){height:26px;background:#1a94ff}.mark i:nth-child(3){height:17px}
    .error{max-width:520px;line-height:1.5}.error h1{margin:0 0 10px;font-size:24px}.error p{margin:0;color:rgba(17,17,17,.64)}
  </style>
</head>
<body>
  <div class="loader" aria-live="polite"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><span>Загружаем CueLab v10…</span></div>
  <script type="module">
    window.__cuelabLoaderVersion='10.0.0';
    window.__cuelabLoaderBuild='2026-09-01-motion-first';
    const names=['payload-v10-b5c01813z-00.txt', 'payload-v10-b5c01813z-01.txt', 'payload-v10-b5c01813z-02.txt', 'payload-v10-b5c01813z-03.txt', 'payload-v10-b5c01813z-04.txt', 'payload-v10-b5c01813z-05.txt', 'payload-v10-b5c01813z-06.txt', 'payload-v10-b5c01813z-07.txt', 'payload-v10-b5c01813z-08.txt', 'payload-v10-b5c01813z-09.txt', 'payload-v10-b5c01813z-10.txt', 'payload-v10-b5c01813z-11.txt', 'payload-v10-b5c01813z-12.txt', 'payload-v10-b5c01813z-13.txt', 'payload-v10-b5c01813z-14.txt', 'payload-v10-b5c01813z-15.txt'];
    const expectedLength=61336;
    const expectedSha='b5c018132eca55e4db641d734249e83b5400a11b5e59fa85ea0d48d188c1398e';
    const hex=b=>Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('');
    try{
      const responses=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'})));
      const bad=responses.find(r=>!r.ok);if(bad)throw new Error(`Часть сборки недоступна: ${bad.status}`);
      const base64=(await Promise.all(responses.map(r=>r.text()))).join('');
      if(base64.length!==expectedLength)throw new Error(`Неверный размер: ${base64.length}`);
      const binary=atob(base64);const gzip=Uint8Array.from(binary,c=>c.charCodeAt(0));
      const digest=hex(await crypto.subtle.digest('SHA-256',gzip));if(digest!==expectedSha)throw new Error('Контрольная сумма не совпала');
      if(typeof DecompressionStream!=='function')throw new Error('Нужна актуальная версия браузера');
      const documentHtml=await new Response(new Blob([gzip]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      if(!documentHtml.includes("const VERSION = '10.0.0'")||!documentHtml.includes('roulette-slow')||!documentHtml.includes('coin-rain')||!documentHtml.includes('reward-legendary'))throw new Error('Проверка CueLab v10 не пройдена');
      document.open();document.write(documentHtml);document.close();
    }catch(error){console.error('[CueLab v10 loader]',error);document.body.innerHTML='<main class="error"><h1>CueLab не загрузился</h1><p>Обновите страницу в актуальной версии Safari, Chrome или Edge.</p></main>'}
  </script>
</body></html>
