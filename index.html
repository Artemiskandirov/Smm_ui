<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <title>CueLab — звуки и хаптики для Учи.ру</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #111; background: #f5f5f5; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 24px; }
    .loader { display: grid; justify-items: center; gap: 14px; color: rgba(17,17,17,.56); font-size: 13px; text-align: center; }
    .mark { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; gap: 4px; border-radius: 13px; background: #111; }
    .mark i { display: block; width: 5px; border-radius: 999px; background: #fff; }
    .mark i:nth-child(1) { height: 12px; opacity: .7; }
    .mark i:nth-child(2) { height: 26px; background: #1a94ff; }
    .mark i:nth-child(3) { height: 17px; }
    .error { max-width: 520px; line-height: 1.5; }
    .error h1 { margin: 0 0 10px; font-size: 24px; }
    .error p { margin: 0; color: rgba(17,17,17,.64); }
  </style>
</head>
<body>
  <div class="loader" aria-live="polite">
    <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <span>Загружаем CueLab…</span>
  </div>
  <script type="module">
    const prefix = 'payload-bcf435';
    const expectedBase64Length = 91560;
    const expectedGzipSha256 = 'bcf435af95f3e05e8868ae8d9e491bff0f179e83fb52a5b1a3a9c6d346f49503';
    const partNames = Array.from({ length: 16 }, (_, index) => `${prefix}-${String(index).padStart(2, '0')}.txt`);

    const toHex = buffer => Array.from(new Uint8Array(buffer), byte => byte.toString(16).padStart(2, '0')).join('');

    try {
      const responses = await Promise.all(partNames.map(name => fetch(name, { cache: 'no-store' })));
      const failed = responses.find(response => !response.ok);
      if (failed) throw new Error(`Не загрузилась часть сборки: HTTP ${failed.status}`);

      const base64 = (await Promise.all(responses.map(response => response.text()))).join('');
      if (base64.length !== expectedBase64Length) throw new Error(`Неверный размер сборки: ${base64.length}`);

      const binary = atob(base64);
      const gzipBytes = Uint8Array.from(binary, char => char.charCodeAt(0));
      const digest = toHex(await crypto.subtle.digest('SHA-256', gzipBytes));
      if (digest !== expectedGzipSha256) throw new Error('Контрольная сумма сборки не совпала');

      if (typeof DecompressionStream !== 'function') throw new Error('Браузер не поддерживает распаковку gzip');
      const html = await new Response(
        new Blob([gzipBytes]).stream().pipeThrough(new DecompressionStream('gzip'))
      ).text();

      if (!html.includes('window.__cuelabTest') || !html.includes('CueLab')) {
        throw new Error('Сборка CueLab не прошла проверку содержимого');
      }

      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      console.error('[CueLab loader]', error);
      document.body.innerHTML = `
        <main class="error">
          <h1>CueLab не загрузился</h1>
          <p>Обновите страницу. Если ошибка повторится, откройте сайт в актуальной версии Safari, Chrome или Edge.</p>
        </main>`;
    }
  </script>
</body>
</html>
